[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros-core"
version = "0.1.0"
description = "CareerOS contract validation utilities"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ingest = ["python-docx>=1.1,<2", "pypdf>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
